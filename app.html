<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0a0f">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>">
<title>Pothole — Music Streaming</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a25;--card:#16161f;--hover:#222230;--active:#2a2a3a;--accent:#8b5cf6;--accent2:#a78bfa;--accent-dark:#7c3aed;--pink:#ec4899;--glow:rgba(139,92,246,.3);--text:#f0f0f5;--text2:#9999aa;--text3:#666677;--border:#2a2a35;--danger:#ef4444;--success:#22c55e;--r:12px;--r2:16px;--r3:24px}
html,body{height:100%;width:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
#root{height:100%;display:flex;flex-direction:column}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--active);border-radius:3px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.fade-in{animation:fadeIn .3s ease-out}
.slide-up{animation:slideUp .4s ease-out}
.spin{animation:spin 1s linear infinite}
.main-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:160px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
// ─── AUDIO ENGINE ───
const audio=new Audio();audio.crossOrigin='anonymous';
let audioState={isPlaying:false,position:0,duration:0,volume:.8,currentTrack:null,isLoading:false,error:null};
let audioListeners=new Set();let ticker=null;
const audioNotify=()=>audioListeners.forEach(fn=>fn({...audioState}));
const startTicker=()=>{stopTicker();ticker=setInterval(()=>{audioState.position=audio.currentTime;audioNotify()},500)};
const stopTicker=()=>{if(ticker){clearInterval(ticker);ticker=null}};
audio.addEventListener('loadedmetadata',()=>{audioState.duration=audio.duration||0;audioState.isLoading=false;audioNotify()});
audio.addEventListener('canplay',()=>{audioState.isLoading=false;audioNotify()});
audio.addEventListener('playing',()=>{audioState.isPlaying=true;audioState.isLoading=false;startTicker();audioNotify()});
audio.addEventListener('pause',()=>{audioState.isPlaying=false;stopTicker();audioNotify()});
audio.addEventListener('ended',()=>{audioState.isPlaying=false;audioState.position=0;stopTicker();audioNotify()});
audio.addEventListener('error',()=>{audioState.isLoading=false;audioState.error='Failed to load stream';stopTicker();audioNotify()});
audio.addEventListener('waiting',()=>{audioState.isLoading=true;audioNotify()});
const playTrack=async t=>{audioState.currentTrack=t;audioState.isLoading=true;audioState.error=null;audioState.position=0;audioNotify();audio.src=t.streamUrl;audio.load();try{await audio.play()}catch(e){audioState.isLoading=false;audioState.error=e.message||'Playback failed';audioNotify()}};
const audioPause=()=>audio.pause();const audioResume=()=>audio.play();
const audioStop=()=>{audio.pause();audio.src='';audioState.currentTrack=null;audioState.position=0;audioNotify()};
const audioSeek=pos=>{audio.currentTime=pos;audioState.position=pos;audioNotify()};
const audioSetVol=v=>{audioState.volume=Math.max(0,Math.min(1,v));audio.volume=audioState.volume;audioNotify()};
const audioSubscribe=fn=>{audioListeners.add(fn);fn({...audioState});return()=>audioListeners.delete(fn)};

// ─── SIMPLE STATE MANAGEMENT ───
let appState={view:'home',searchQuery:'',searchResults:{jamendo:[],radio:[]},searchTab:'music',searchLoading:false,radioStations:[],radioGenre:'',radioLoading:true,favorites:JSON.parse(localStorage.getItem('pothole_favs')||'[]')};
let appListeners=new Set();
const setAppState=s=>{appState={...appState,...s};appListeners.forEach(fn=>fn(appState))};
const subscribeApp=fn=>{appListeners.add(fn);fn(appState);return()=>appListeners.delete(fn)};

// ─── API ───
const RADIO_API='https://de1.api.radio-browser.info/json';
const JAMENDO_API='https://api.jamendo.com/v3.0';
const searchRadio=async(q,l=30)=>{try{const r=await fetch(`${RADIO_API}/stations/search?name=${encodeURIComponent(q)}&limit=${l}&hidebroken=true&order=votes&reverse=true`);return await r.json()}catch(e){return[]}};
const getTopRadio=async(l=20)=>{try{const r=await fetch(`${RADIO_API}/stations/topvote/${l}`);return await r.json()}catch(e){return[]}};
const getRadioGenre=async(g,l=20)=>{try{const r=await fetch(`${RADIO_API}/stations/bytag/${encodeURIComponent(g)}?limit=${l}&hidebroken=true&order=votes&reverse=true`);return await r.json()}catch(e){return[]}};
const searchJamendo=async(q,l=30)=>{try{const r=await fetch(`${JAMENDO_API}/tracks/?client_id=2c9a11b6&format=json&limit=${l}&namesearch=${encodeURIComponent(q)}&include=musicinfo&audioformat=mp32`);const d=await r.json();return d.results||[]}catch(e){return[]}};
const getJamendoCharts=async(l=20)=>{try{const r=await fetch(`${JAMENDO_API}/tracks/?client_id=2c9a11b6&format=json&limit=${l}&order=popularity_total&audioformat=mp32`);const d=await r.json();return d.results||[]}catch(e){return[]}};
const getJamendoGenre=async(g,l=20)=>{try{const r=await fetch(`${JAMENDO_API}/tracks/?client_id=2c9a11b6&format=json&limit=${l}&tags=${encodeURIComponent(g)}&order=popularity_total&audioformat=mp32`);const d=await r.json();return d.results||[]}catch(e){return[]}};
const radioToTrack=s=>({id:s.stationuuid,name:s.name,artist:s.country||'Radio',artwork:s.favicon,streamUrl:s.url_resolved||s.url,source:'radio'});
const jamendoToTrack=t=>({id:t.id,name:t.name,artist:t.artist_name,album:t.album_name,artwork:t.album_image,streamUrl:t.audio,duration:t.duration,source:'jamendo'});
const GENRES=['pop','rock','hip hop','electronic','jazz','classical','r&b','country','latin','indie','metal','folk','blues','reggae','soul','funk','ambient','lo-fi','afrobeats','bongo','gengetone','amapiano','gospel','benga'];
const SEARCHES=['lo-fi','afrobeats','bongo','amapiano','gengetone','gospel','r&b','hip hop','reggae','jazz'];

// ─── DOM HELPER ───
const h=(tag,...args)=>{const el=document.createElement(tag);for(const a of args){if(a==null)continue;if(typeof a==='string'||typeof a==='number'){el.appendChild(document.createTextNode(a))}else if(a instanceof Node){el.appendChild(a)}else if(Array.isArray(a)){a.forEach(c=>{if(c instanceof Node)el.appendChild(c);else if(typeof c==='string')el.appendChild(document.createTextNode(c))})}else if(typeof a==='object'){for(const[k,v]of Object.entries(a)){if(k==='style')Object.assign(el.style,v);else if(k==='className')el.className=v;else if(k.startsWith('on'))el[k]=v;else el.setAttribute(k,v)}}}return el};
const txt=s=>document.createTextNode(s);

// ─── ICONS ───
const iconPaths={home:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z',search:'M11 19a8 8 0 100-16 8 8 0 000 16zm9.35-3.65l-4.24-4.24',radio:'M12 2a10 10 0 100 20 10 10 0 000-20zm0 6a4 4 0 100 8 4 4 0 000-8z',music:'M9 18V5l12-2v13',heart:'M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z',play:'M5 3l19 12-19 12V3z',pause:'M6 4h4v16H6V4zm8 0h4v16h-4V4z',skipBack:'M19 20L9 12l10-8v16zM5 19V5',skipForward:'M5 4l10 8-10 8V4zm14 0v14',volume:'M11 5L6 9H2v6h4l5 4V5zm8.07-1.07a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07',volumeX:'M11 5L6 9H2v6h4l5 4V5zm12 7l-6 6m0-6l6 6',disc:'M12 2a10 10 0 100 20 10 10 0 000-20zm0 14a4 4 0 100-8 4 4 0 000 8z',chevron:'M9 18l6-6-6-6',x:'M18 6L6 18M6 12l12 6',arrowLeft:'M19 12H5m7-7l-7 7 7 7',list:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',globe:'M12 2a10 10 0 100 20 10 10 0 000-20zm-1 17.93A8 8 0 014.07 13h2.09a4 4 0 003.74 2.5c.95 0 1.86-.3 2.59-.84l.71.71A5.97 5.97 0 0111 19.93zM17.93 13A8 8 0 0113 17.93v-2.09a4 4 0 002.5-3.74c0-.95-.3-1.86-.84-2.59l.71-.71A5.97 5.97 0 0117.93 13z',shuffle:'M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5'};
const Icon=({name,size=18})=>{
  const p=iconPaths[name];if(!p)return null;
  return h('svg',{width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'},h('path',{d:p}));
};

const fmt=s=>{if(!s||!isFinite(s))return'0:00';const m=Math.floor(s/60),sec=Math.floor(s%60);return`\${m}:\${sec.toString().padStart(2,'0')}`};

// ─── COMPONENTS ───
function TrackCard(track){
  const active=audioState.currentTrack?.id===track.id;
  return h('div',{className:`card\${active?' active':''}`,style:{background:'var(--card)',borderRadius:'var(--r)',overflow:'hidden',cursor:'pointer',transition:'.2s',border:'1px solid transparent'},onclick:()=>playTrack(track)},
    h('div',{style:{position:'relative',aspectRatio:'1',background:'var(--bg3)',overflow:'hidden'}},
      track.artwork?h('img',{src:track.artwork,alt:'',style:{width:'100%',height:'100%',objectFit:'cover'},loading:'lazy'}):h('div',{style:{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}},Icon({name:'music',size:24})),
      h('div',{style:{position:'absolute',inset:0,background:'rgba(0,0,0,.4)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',opacity:active&&audioState.isPlaying?1:0,transition:'.2s'}},active&&audioState.isPlaying?Icon({name:'pause',size:20}):Icon({name:'play',size:20}))
    ),
    h('div',{style:{padding:'10px 12px'}},
      h('span',{style:{display:'block',fontSize:13,fontWeight:600,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},track.name),
      h('span',{style:{display:'block',fontSize:11,color:'var(--text3)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},track.artist)
    )
  );
}

function TrackItem(track){
  const active=audioState.currentTrack?.id===track.id;
  const isFav=appState.favorites.some(f=>f.id===track.id);
  const toggleFav=()=>{const n=isFav?appState.favorites.filter(f=>f.id!==track.id):[track,...appState.favorites];setAppState({favorites:n});localStorage.setItem('pothole_favs',JSON.stringify(n))};
  return h('div',{className:`item\${active?' active':''}`,style:{display:'flex',alignItems:'center',gap:12,padding:'10px 12px',borderRadius:'var(--r)',cursor:'pointer',transition:'.2s',border:'1px solid transparent',background:active?'var(--card)':''},onclick:()=>playTrack(track)},
    h('div',{style:{position:'relative',width:44,height:44,borderRadius:'var(--r)',overflow:'hidden',background:'var(--bg3)',flexShrink:0}},
      track.artwork?h('img',{src:track.artwork,alt:'',style:{width:'100%',height:'100%',objectFit:'cover'},loading:'lazy'}):h('div',{style:{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}},Icon({name:'music',size:16})),
      active&&audioState.isPlaying?h('div',{style:{position:'absolute',bottom:4,right:4,display:'flex',gap:2,alignItems:'flex-end'}},[0,1,2].map(i=>h('span',{key:i,style:{width:3,height:8-i*2,background:'var(--accent)',borderRadius:1,animation:'pulse .8s ease-in-out infinite',animationDelay:`\${i*.2}s`}}))):null
    ),
    h('div',{style:{flex:1,minWidth:0}},
      h('span',{style:{display:'block',fontSize:14,fontWeight:500,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},track.name),
      h('span',{style:{display:'block',fontSize:12,color:'var(--text3)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},track.artist)
    ),
    h('button',{onclick:e=>{e.stopPropagation();toggleFav()},style:{background:'none',border:'none',color:isFav?'var(--danger)':'var(--text3)',padding:8,borderRadius:'50%',transition:'.2s'}},Icon({name:'heart',size:16}))
  );
}

function StationItem(station){
  const track=radioToTrack(station);
  return h('div',{className:'item',style:{display:'flex',alignItems:'center',gap:12,padding:'10px 12px',borderRadius:'var(--r)',cursor:'pointer',transition:'.2s'},onclick:()=>playTrack(track)},
    h('div',{style:{width:44,height:44,borderRadius:'50%',overflow:'hidden',background:'var(--bg3)',flexShrink:0,position:'relative'}},
      station.favicon?h('img',{src:station.favicon,alt:'',style:{width:'100%',height:'100%',objectFit:'cover'},loading:'lazy'}):h('div',{style:{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}},Icon({name:'radio',size:16})),
      h('span',{style:{position:'absolute',bottom:-2,right:-2,background:'var(--danger)',color:'white',fontSize:8,fontWeight:700,padding:'2px 5px',borderRadius:4}},'LIVE')
    ),
    h('div',{style:{flex:1,minWidth:0}},
      h('span',{style:{display:'block',fontSize:14,fontWeight:600,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},station.name),
      h('span',{style:{display:'block',fontSize:12,color:'var(--text3)',marginTop:2}},station.country,station.bitrate?` · \${station.bitrate}kbps`:'')
    )
  );
}

function GenreCard({genre}){
  let loading=false;
  return h('button',{disabled:loading,style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 16px',background:'var(--card)',border:'1px solid var(--border)',borderRadius:'var(--r)',color:'var(--text)',fontSize:14,fontWeight:500,textTransform:'capitalize'},async function(){if(loading)return;loading=true;try{const t=await getJamendoGenre(genre,20);if(t.length>0)playTrack(jamendoToTrack(t[0]))}catch(e){console.error(e)}finally{loading=false}},
    h('span',null,genre),loading?h(Icon,{name:'disc',size:16,className:'spin'}):h(Icon,{name:'chevron',size:16})
  );
}

function PlayerBar(){
  const bar=h('div',{style:{position:'fixed',bottom:72,left:0,right:0,background:'var(--bg2)',borderTop:'1px solid var(--border)',zIndex:100,boxShadow:'0 -4px 24px rgba(0,0,0,.4)',display:'none'}});
  const progress=h('div',{style:{height:3,background:'var(--active)',cursor:'pointer'},onclick:e=>{const r=e.currentTarget.getBoundingClientRect();audioSeek(((e.clientX-r.left)/r.width)*(audioState.duration||0))}});
  const progressFill=h('div',{style:{height:'100%',width:'0%',background:'linear-gradient(90deg,var(--accent),var(--accent2))',transition:'width .3s linear'}});
  progress.appendChild(progressFill);
  const content=h('div',{style:{display:'flex',alignItems:'center',gap:12,padding:'10px 16px'}});
  const timeRow=h('div',{style:{display:'flex',justifyContent:'space-between',padding:'0 16px 6px',fontSize:10,color:'var(--text3)'}});
  bar.appendChild(progress);bar.appendChild(content);bar.appendChild(timeRow);

  audioSubscribe(s=>{
    if(!s.currentTrack){bar.style.display='none';return}
    bar.style.display='block';
    progressFill.style.width=`\${s.duration>0?Math.min((s.position/s.duration)*100,100):0}%`;
    content.innerHTML='';
    content.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:10,flex:1,minWidth:0}},
      h('div',{style:{width:40,height:40,borderRadius:'var(--r)',overflow:'hidden',background:'var(--bg3)',flexShrink:0}},
        s.currentTrack.artwork?h('img',{src:s.currentTrack.artwork,alt:'',style:{width:'100%',height:'100%',objectFit:'cover',animation:s.isPlaying?'spin 3s linear infinite':'none'}}):h('div',{style:{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}},Icon({name:'music',size:18}))
      ),
      h('div',{style:{minWidth:0}},
        h('span',{style:{display:'block',fontSize:13,fontWeight:600,color:'var(--text)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},s.currentTrack.name),
        h('span',{style:{display:'block',fontSize:11,color:'var(--text3)'}},s.currentTrack.artist)
      )
    ));
    content.appendChild(h('button',{onclick:()=>s.isPlaying?audioPause():audioResume(),style:{width:40,height:40,borderRadius:'50%',background:'var(--accent)',color:'white',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 2px 12px var(--glow)'}},
      s.isLoading?h(Icon,{name:'disc',size:20,className:'spin'}):s.isPlaying?h(Icon,{name:'pause',size:20}):h(Icon,{name:'play',size:20})
    ));
    content.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:6}},
      h('button',{onclick:()=>audioSetVol(s.volume>0?0:.8)},Icon({name:s.volume===0?'volumeX':'volume',size:16})),
      h('input',{type:'range',min:0,max:1,step:.01,value:s.volume,oninput:e=>audioSetVol(parseFloat(e.target.value)),style:{width:70}})
    ));
    timeRow.innerHTML='';
    timeRow.appendChild(h('span',null,fmt(s.position)));
    timeRow.appendChild(h('span',null,fmt(s.duration)));
  });
  return bar;
}

// ─── VIEWS ───
function HomeView(){
  const wrap=h('div',{className:'fade-in'});
  const hero=h('div',{style:{padding:'20px 16px 16px'}});
  hero.appendChild(h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}},
    h('h1',{style:{fontSize:28,fontWeight:800}},'Pothole'),
    h('a',{href:'index.html',style:{fontSize:13,color:'var(--accent2)',textDecoration:'none',padding:'8px 16px',background:'var(--bg3)',borderRadius:'var(--r3)'}},'← Home')
  ));
  hero.appendChild(h('p',{style:{color:'var(--text2)',fontSize:14,marginBottom:16}},'Stream free music from around the world'));
  const chips=h('div',{style:{display:'flex',gap:8,overflowX:'auto',paddingBottom:4}});
  SEARCHES.forEach(q=>chips.appendChild(h('button',{onclick:()=>setAppState({view:'search',searchQuery:q}),style:{flexShrink:0,padding:'8px 16px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r3)',color:'var(--text2)',fontSize:13,fontWeight:500,textTransform:'capitalize'}},q)));
  hero.appendChild(chips);
  wrap.appendChild(hero);

  const chartsSec=h('section',{style:{padding:'0 16px 20px'}});
  chartsSec.appendChild(h('h2',{style:{fontSize:18,fontWeight:700,marginBottom:12}},'📈 Top Tracks'));
  const chartsGrid=h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}});
  for(let i=0;i<6;i++)chartsGrid.appendChild(h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',aspectRatio:'1',animation:'pulse 1.5s ease-in-out infinite'}}));
  chartsSec.appendChild(chartsGrid);
  wrap.appendChild(chartsSec);

  const radioSec=h('section',{style:{padding:'0 16px 20px'}});
  radioSec.appendChild(h('h2',{style:{fontSize:18,fontWeight:700,marginBottom:12}},'📻 Popular Radio'));
  const radioList=h('div',{style:{display:'flex',flexDirection:'column',gap:4}});
  for(let i=0;i<5;i++)radioList.appendChild(h('div',{style:{height:60,background:'var(--bg3)',borderRadius:'var(--r)',animation:'pulse 1.5s ease-in-out infinite'}}));
  radioSec.appendChild(radioList);
  wrap.appendChild(radioSec);

  const genreSec=h('section',{style:{padding:'0 16px 20px'}});
  genreSec.appendChild(h('h2',{style:{fontSize:18,fontWeight:700,marginBottom:12}},'🎸 Genres'));
  const genreGrid=h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}});
  GENRES.slice(0,12).forEach(g=>genreGrid.appendChild(GenreCard({genre:g})));
  genreSec.appendChild(genreGrid);
  wrap.appendChild(genreSec);

  // Load data
  (async()=>{
    try{
      const[j,r]=await Promise.all([getJamendoCharts(10),getTopRadio(10)]);
      chartsGrid.innerHTML='';j.slice(0,6).forEach(t=>chartsGrid.appendChild(TrackCard(jamendoToTrack(t))));
      radioList.innerHTML='';r.slice(0,5).forEach(s=>radioList.appendChild(StationItem(s)));
    }catch(e){console.error(e)}
  })();

  return wrap;
}

function SearchView(){
  const wrap=h('div',{className:'fade-in'});
  const header=h('div',{style:{padding:16,position:'sticky',top:0,background:'var(--bg)',zIndex:10}});
  header.appendChild(h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:12}},
    h('button',{onclick:()=>setAppState({view:'home'}),style:{padding:8,color:'var(--text2)'}},Icon({name:'arrowLeft',size:20})),
    h('h1',{style:{fontSize:20,fontWeight:700}},'Search')
  ));
  const inputWrap=h('div',{style:{position:'relative',display:'flex',alignItems:'center'}});
  inputWrap.appendChild(Icon({name:'search',size:18,style:{position:'absolute',left:14,color:'var(--text3)'}}));
  const input=h('input',{type:'text',placeholder:'Search music, artists, radio...',value:appState.searchQuery,style:{width:'100%',padding:'14px 40px 14px 42px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r3)',color:'var(--text)',fontSize:15,outline:'none'}});
  input.oninput=e=>setAppState({searchQuery:e.target.value});
  input.onkeydown=async e=>{if(e.key==='Enter'&&input.value.trim()){setAppState({searchLoading:true});try{const[j,r]=await Promise.all([searchJamendo(input.value,30),searchRadio(input.value,20)]);setAppState({searchResults:{jamendo:j,radio:r},searchLoading:false})}catch(err){setAppState({searchLoading:false})}}};
  inputWrap.appendChild(input);
  header.appendChild(inputWrap);
  const tabs=h('div',{style:{display:'flex',gap:8,marginTop:12}});
  ['music','radio'].forEach(t=>tabs.appendChild(h('button',{onclick:()=>setAppState({searchTab:t}),style:{display:'flex',alignItems:'center',gap:6,padding:'8px 16px',background:appState.searchTab===t?'var(--accent)':'var(--bg3)',border:'1px solid '+(appState.searchTab===t?'var(--accent)':'var(--border)'),borderRadius:'var(--r3)',color:appState.searchTab===t?'white':'var(--text2)',fontSize:13,fontWeight:500}},Icon({name:t==='music'?'music':'radio',size:16}),t==='music'?'Music':'Radio')));
  header.appendChild(tabs);
  wrap.appendChild(header);

  const results=h('div',{style:{padding:'0 12px'}});
  wrap.appendChild(results);

  subscribeApp(s=>{
    input.value=s.searchQuery;
    if(!s.searchResults.jamendo.length&&!s.searchResults.radio.length&&!s.searchLoading){
      results.innerHTML='';
      results.appendChild(h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'60px 32px',textAlign:'center',color:'var(--text3)'}},
        h(Icon,{name:'music',size:48}),
        h('h3',{style:{fontSize:18,fontWeight:600,color:'var(--text2)',margin:'16px 0 8px'}},'Search for music'),
        h('p',{style:{fontSize:14}},'Find songs, artists, or radio stations'),
        h('div',{style:{display:'flex',gap:8,flexWrap:'wrap',justifyContent:'center',marginTop:16}},SEARCHES.slice(0,6).map(q=>h('button',{onclick:()=>{input.value=q;input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter'}))},style:{padding:'8px 16px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'var(--r3)',color:'var(--text2)',fontSize:13,textTransform:'capitalize'}},q)))
      ));
    }else if(s.searchLoading){
      results.innerHTML='';
      const grid=h('div',{style:{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:12}});
      for(let i=0;i<6;i++)grid.appendChild(h('div',{style:{background:'var(--bg3)',borderRadius:'var(--r)',aspectRatio:'1',animation:'pulse 1.5s ease-in-out infinite'}}));
      results.appendChild(grid);
    }else{
      results.innerHTML='';
      if(s.searchTab==='music')s.searchResults.jamendo.forEach(t=>results.appendChild(TrackItem(jamendoToTrack(t))));
      else s.searchResults.radio.forEach(s2=>results.appendChild(StationItem(s2)));
    }
  });
  return wrap;
}

function RadioView(){
  const wrap=h('div',{className:'fade-in'});
  wrap.appendChild(h('div',{style:{padding:'20px 16px 16px'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:16}},
      h('button',{onclick:()=>setAppState({view:'home'}),style:{padding:8,color:'var(--text2)'}},Icon({name:'arrowLeft',size:20})),
      h('h1',{style:{fontSize:24,fontWeight:800}},'📻 Live Radio')
    ),
    h('p',{style:{color:'var(--text2)',fontSize:14}},'Stream radio stations worldwide')
  ));
  const chips=h('div',{style:{display:'flex',gap:8,overflowX:'auto',padding:'0 16px 16px'}});
  chips.appendChild(h('button',{onclick:async()=>{setAppState({radioGenre:'',radioLoading:true});const d=await getTopRadio(30);setAppState({radioStations:d,radioLoading:false})},style:{flexShrink:0,padding:'8px 16px',background:!appState.radioGenre?'var(--accent)':'var(--bg3)',border:'1px solid '+(!appState.radioGenre?'var(--accent)':'var(--border)'),borderRadius:'var(--r3)',color:!appState.radioGenre?'white':'var(--text2)',fontSize:13,fontWeight:500}},'All'));
  GENRES.slice(0,10).forEach(g=>chips.appendChild(h('button',{onclick:async()=>{setAppState({radioGenre:g,radioLoading:true});const d=await getRadioGenre(g,30);setAppState({radioStations:d,radioLoading:false})},style:{flexShrink:0,padding:'8px 16px',background:appState.radioGenre===g?'var(--accent)':'var(--bg3)',border:'1px solid '+(appState.radioGenre===g?'var(--accent)':'var(--border)'),borderRadius:'var(--r3)',color:appState.radioGenre===g?'white':'var(--text2)',fontSize:13,fontWeight:500,textTransform:'capitalize'}},g)));
  wrap.appendChild(chips);
  const list=h('div',{style:{display:'flex',flexDirection:'column',gap:4,padding:'0 12px'}});
  wrap.appendChild(list);

  // Load initial
  (async()=>{const d=await getTopRadio(30);setAppState({radioStations:d,radioLoading:false})})();

  subscribeApp(s=>{
    list.innerHTML='';
    if(s.radioLoading){for(let i=0;i<8;i++)list.appendChild(h('div',{style:{height:60,background:'var(--bg3)',borderRadius:'var(--r)',animation:'pulse 1.5s ease-in-out infinite'}}));}
    else s.radioStations.forEach(st=>list.appendChild(StationItem(st)));
  });
  return wrap;
}

function FavoritesView(){
  const wrap=h('div',{className:'fade-in'});
  wrap.appendChild(h('div',{style:{padding:'20px 16px 16px'}},
    h('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:16}},
      h('button',{onclick:()=>setAppState({view:'home'}),style:{padding:8,color:'var(--text2)'}},Icon({name:'arrowLeft',size:20})),
      h('h1',{style:{fontSize:24,fontWeight:800}},'❤️ Favorites')
    )
  ));
  const list=h('div',{style:{display:'flex',flexDirection:'column',gap:4,padding:'0 12px'}});
  wrap.appendChild(list);
  subscribeApp(s=>{
    list.innerHTML='';
    if(s.favorites.length===0){
      list.appendChild(h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'60px 32px',textAlign:'center',color:'var(--text3)'}},
        h(Icon,{name:'heart',size:48}),
        h('h3',{style:{fontSize:18,fontWeight:600,color:'var(--text2)',margin:'16px 0 8px'}},'No favorites yet'),
        h('p',{style:{fontSize:14}},'Tap the heart on any track to save it')
      ));
    }else s.favorites.forEach(t=>list.appendChild(TrackItem(t)));
  });
  return wrap;
}

// ─── BOTTOM NAV ───
function BottomNav(){
  const nav=h('nav',{style:{position:'fixed',bottom:0,left:0,right:0,display:'flex',alignItems:'center',justifyContent:'spaceAround',background:'var(--bg2)',borderTop:'1px solid var(--border)',padding:'8px 0',zIndex:100}});
  [{id:'home',icon:'home',label:'Home'},{id:'search',icon:'search',label:'Search'},{id:'radio',icon:'radio',label:'Radio'},{id:'favorites',icon:'heart',label:'Favs'}].forEach(n=>{
    const btn=h('button',{onclick:()=>setAppState({view:n.id}),style:{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'6px 12px',background:'none',border:'none',color:appState.view===n.id?'var(--accent)':'var(--text3)',fontSize:10,fontWeight:500}});
    btn.appendChild(Icon({name:n.icon,size:20}));
    btn.appendChild(txt(n.label));
    nav.appendChild(btn);
  });
  return nav;
}

// ─── APP ───
function App(){
  const root=document.getElementById('root');
  const main=h('main',{className:'main-scroll'});
  const player=PlayerBar();
  const nav=BottomNav();
  root.appendChild(main);root.appendChild(player);root.appendChild(nav);

  const views={home:HomeView,search:SearchView,radio:RadioView,favorites:FavoritesView};
  subscribeApp(s=>{
    main.innerHTML='';
    const View=views[s.view]||HomeView;
    main.appendChild(View());
  });
}

App();
</script>

.item:hover{background:var(--card)}
.item.active{border-color:var(--accent)!important}
</style>
</body>
